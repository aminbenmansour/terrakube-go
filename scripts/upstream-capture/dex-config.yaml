issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: terrakube-app
    secret: terrakube-secret
    name: Terrakube
    redirectURIs:
      - http://localhost:3000
      - http://localhost:3000/callback
      - http://localhost:18080
      - http://localhost:18080/callback

# No users: the capture mints a PAT directly (pat.py), because a Dex token has no
# groups claim here and every organization read needs the owner group. A demo
# password hash would be committed entropy that buys nothing.
