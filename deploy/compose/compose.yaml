# Compose stack for local development.
#
#   docker compose -f deploy/compose/compose.yaml up -d
#   podman compose -f deploy/compose/compose.yaml up -d   (needs a compose provider)
#
# The api service is behind the "app" profile so the default stack only starts
# dependencies:
#
#   docker compose -f deploy/compose/compose.yaml --profile app up --build
#
name: terrakube-go

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: terrakube
      # Local development only: no password is required inside the container.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: terrakube
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrakube -d terrakube"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: docker.io/pgsty/minio
    command: ["server", "/data", "--console-address", ":9001"]
    # MinIO generates root credentials on first start; see `podman logs`.
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: api
    environment:
      TERRAKUBE_ENV: dev
      TERRAKUBE_LOG_LEVEL: debug
      TERRAKUBE_DATABASE_URL: postgres://terrakube@postgres:5432/terrakube?sslmode=disable
      TERRAKUBE_REDIS_URL: redis://redis:6379/0
      TERRAKUBE_STORAGE_TYPE: local
      TERRAKUBE_STORAGE_LOCAL_PATH: /tmp/terrakube
      TERRAKUBE_PUBLIC_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
