# Compose stack for local development.
#
#   docker compose -f deploy/compose/compose.yaml up -d
#   podman compose -f deploy/compose/compose.yaml up -d   (needs a compose provider)
#
# The api service is behind the "app" profile so the default stack only starts
# dependencies:
#
#   docker compose -f deploy/compose/compose.yaml --profile app up --build
#
# The ui profile adds the upstream React UI as its own container, which is the
# split-origin deployment:
#
#   docker compose -f deploy/compose/compose.yaml --profile app --profile ui up
#
# The image is built by https://github.com/aminbenmansour/terrakube-ui and lives
# in a private GHCR package, so either log in (`podman login ghcr.io`) or point
# TERRAKUBE_UI_IMAGE at a build of that repository.
#
name: terrakube-go

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: terrakube
      # Local development only: no password is required inside the container.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: terrakube
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrakube -d terrakube"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: docker.io/pgsty/minio
    command: ["server", "/data", "--console-address", ":9001"]
    # MinIO generates root credentials on first start; see `podman logs`.
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: api
    environment:
      TERRAKUBE_ENV: dev
      TERRAKUBE_LOG_LEVEL: debug
      TERRAKUBE_DATABASE_URL: postgres://terrakube@postgres:5432/terrakube?sslmode=disable
      TERRAKUBE_REDIS_URL: redis://redis:6379/0
      TERRAKUBE_STORAGE_TYPE: local
      TERRAKUBE_STORAGE_LOCAL_PATH: /tmp/terrakube
      TERRAKUBE_PUBLIC_URL: http://localhost:8080
      # Needed only by the ui profile, which serves the UI from another origin.
      TERRAKUBE_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Built by https://github.com/aminbenmansour/terrakube-ui at the pinned tag.
  # Do not point this at a fork: the point of the UI is that it is the one
  # upstream ships.
  ui:
    profiles: ["ui"]
    image: ${TERRAKUBE_UI_IMAGE:-ghcr.io/aminbenmansour/terrakube-ui:2.34.3}
    environment:
      REACT_APP_TERRAKUBE_API_URL: http://localhost:8080/api/v1/
      REACT_APP_CLIENT_ID: terrakube-app
      REACT_APP_AUTHORITY: http://localhost:5556/dex
      REACT_APP_REDIRECT_URI: http://localhost:3000
      REACT_APP_REGISTRY_URI: http://localhost:8080/registry
      REACT_APP_SCOPE: openid profile email groups
      REACT_APP_TERRAKUBE_VERSION: ${TERRAKUBE_UI_TAG:-2.34.3}
    ports:
      - "3000:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
